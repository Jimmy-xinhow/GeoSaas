name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── pnpm ──────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      # ── Node.js + cache ──────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ── Install dependencies ─────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma Client ───────────────────────────────
      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @geovault/shared --fail-if-no-match build

      # ── Dependency Audit ─────────────────────────────────────
      - name: Security audit
        run: pnpm audit --audit-level=high || true

      # ── Lint ─────────────────────────────────────────────────
      - name: Lint
        run: pnpm lint

      # ── Typecheck ────────────────────────────────────────────
      - name: Typecheck (apps/api)
        run: pnpm --filter @geovault/api --fail-if-no-match exec tsc --noEmit

      - name: Typecheck (apps/web)
        run: pnpm --filter @geovault/web --fail-if-no-match exec tsc --noEmit

      # ── Test ─────────────────────────────────────────────────
      - name: Test (apps/api)
        run: pnpm --filter @geovault/api --fail-if-no-match run test --runInBand --ci

      # ── Build ────────────────────────────────────────────────
      - name: Build
        run: pnpm build

  # ── E2E Tests (separate job) ──────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    if: github.event_name != 'workflow_call'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @geovault/shared --fail-if-no-match build

      - name: Install Playwright browsers
        run: pnpm --filter @geovault/web --fail-if-no-match exec playwright install --with-deps chromium

      - name: Build API
        run: pnpm --filter @geovault/api --fail-if-no-match build

      - name: Build web
        run: pnpm --filter @geovault/web --fail-if-no-match build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

      - name: Start API server
        run: pnpm --filter @geovault/api --fail-if-no-match start:prod > /tmp/geovault-api.log 2>&1 &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ci-e2e-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production
          ADMIN_EMAIL: e2e-admin@test.local
          ADMIN_PASSWORD: E2eAdmin123!@
          E2E: "1"
          FRONTEND_URL: http://localhost:3001
          PORT: 4000
          NODE_ENV: test

      - name: Start web server
        run: pnpm --filter @geovault/web --fail-if-no-match start -p 3001 > /tmp/geovault-web.log 2>&1 &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

      - name: Wait for E2E servers
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/api/health >/dev/null \
              && curl --fail --silent http://localhost:3001 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/geovault-api.log || true
          cat /tmp/geovault-web.log || true
          exit 1

      - name: Run E2E tests
        run: pnpm --filter @geovault/web --fail-if-no-match test:e2e
        env:
          E2E_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
